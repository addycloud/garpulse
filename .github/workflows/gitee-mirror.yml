name: Mirror to Gitee

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  push-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push mirror to Gitee
        run: |
          git push --force "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/addycloud/GarPulse.git" "HEAD:refs/heads/main"
          git push --force "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/addycloud/GarPulse.git" --tags || true

  publish-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: push-code
    steps:
      - name: Download GitHub release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.release.tag_name }}"
          curl -s -H "Authorization: Bearer $GH_TOKEN" "$URL" > release.json
          ASSET_URL=$(python3 -c "
import json
d=json.load(open('release.json'))
a=[x for x in d['assets'] if x['name'].endswith('.apk')]
print(a[0]['url'] if a else '')")
          echo "ASSET_URL=$ASSET_URL" >> $GITHUB_ENV
          NAME=$(python3 -c "
import json
d=json.load(open('release.json'))
a=[x for x in d['assets'] if x['name'].endswith('.apk')]
print(a[0]['name'] if a else '')")
          echo "ASSET_NAME=$NAME" >> $GITHUB_ENV
      - name: Upload asset
        if: env.ASSET_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o "$ASSET_NAME" "$ASSET_URL"
          ls -la "$ASSET_NAME"
      - name: Create Gitee release and upload APK
        if: env.ASSET_URL != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          python3 - <<'PY'
import json, os, urllib.request, urllib.parse

tok = os.environ["GITEE_TOKEN"]
tag = os.environ["GITEE_TAG"]
name = os.environ["GITEE_NAME"]
body = os.environ["GITEE_BODY"] or ""
asset = os.environ["ASSET_NAME"]

def api(url, data=None, files=None):
    if data is not None:
        data["access_token"] = tok
    req = urllib.request.Request(url, data=data, files=files, method="POST")
    return json.load(urllib.request.urlopen(req))

# Create release (or reuse existing tag's release)
try:
    rel = api("https://gitee.com/api/v5/repos/addycloud/GarPulse/releases",
              data={"tag_name": tag, "name": tag, "body": body,
                    "prerelease": "false", "target_commitish": "main"})
except Exception:
    import urllib.request as u
    req = u.Request("https://gitee.com/api/v5/repos/addycloud/GarPulse/releases/tags/" + tag)
    rel = json.load(u.urlopen(req))

rid = rel["id"]
# Upload APK as release attachment
boundary = "----garpulseboundary"
with open(asset, "rb") as f:
    content = f.read()
part = (f"--{boundary}\r\n"
        f'Content-Disposition: form-data; name="file"; filename="{asset}"\r\n'
        "Content-Type: application/vnd.android.package-archive\r\n\r\n").encode() + content + \
       f"\r\n--{boundary}--\r\n".encode()
url = (f"https://gitee.com/api/v5/repos/addycloud/GarPulse/releases/{rid}/release-files?"
       + urllib.parse.urlencode({"access_token": tok}))
req = urllib.request.Request(url, data=part, method="POST",
                             headers={"Content-Type": f"multipart/form-data; boundary={boundary}"})
print(urllib.request.urlopen(req).read().decode()[:200])
PY
        env:
          GITEE_TAG: ${{ github.event.release.tag_name }}
          GITEE_NAME: ${{ github.event.release.name }}
          GITEE_BODY: ${{ github.event.release.body }}

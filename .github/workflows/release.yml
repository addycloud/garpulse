name: Release

# 不自动发布：只有在 Actions 页面手动点击 "Run workflow" 时才构建并发布 release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.6). Leave empty to auto-increment patch from latest v* tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Skip the action's default `tools` install: that package no longer exists in
          # current cmdline-tools and fails the step. The pinned packages are installed below.
          packages: ''

      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signing is optional. Add repo secrets to produce a signed APK; otherwise an
      # unsigned release APK is built (F-Droid signs its own builds regardless).
      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.HEARTWOOD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HEARTWOOD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEARTWOOD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HEARTWOOD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "HEARTWOOD_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "HEARTWOOD_STORE_PASSWORD=$STORE_PASSWORD"
              echo "HEARTWOOD_KEY_ALIAS=$KEY_ALIAS"
              echo "HEARTWOOD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No signing secrets set, building an unsigned release APK."
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Determine tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            LATEST=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "v0.0.0")
            TAG=$(python3 -c "
v='$LATEST'.lstrip('v').split('.')
v[-1] = str(int(v[-1]) + 1) if v[-1].isdigit() else '1'
print('v' + '.'.join(v))")
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Release tag: $TAG"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/garpulse-${TAG}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.apk
          generate_release_notes: true
